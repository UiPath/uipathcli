name: CI
on: [push]

env:
  UIPATHCLI_BASE_VERSION: "v2.0"
  GO_VERSION: "1.26.4"

jobs:
  build:
    runs-on: uipath-ubuntu-latest
    permissions:
      contents: read
    outputs:
      UIPATHCLI_VERSION: ${{ steps.version.outputs.UIPATHCLI_VERSION }}
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Version
        id: version
        run: |
          UIPATHCLI_VERSION=$(./version.sh "$UIPATHCLI_BASE_VERSION")
          echo "UIPATHCLI_VERSION=$(echo $UIPATHCLI_VERSION)" >> $GITHUB_ENV
          echo "UIPATHCLI_VERSION=$(echo $UIPATHCLI_VERSION)" >> $GITHUB_OUTPUT
      - name: Build
        run: go build -ldflags="-X github.com/UiPath/uipathcli/utils.Version=$UIPATHCLI_VERSION" .
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.2
          golangci-lint run
      - name: Package
        run: ./build.sh && ./package.sh
      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: packages
          path: build/packages/
          if-no-files-found: error

  test_linux:
    runs-on: uipath-ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Test
        run: go test -coverprofile="coverage.out" -coverpkg "$(go list github.com/UiPath/uipathcli/... | grep -v 'test' | tr '\n' ',')" ./...
      - name: Coverage
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}      
        run: |
          go install github.com/mattn/goveralls@latest
          goveralls -coverprofile="coverage.out" -service="github"

  test_windows:
    runs-on: uipath-windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Test
        run: go test ./...

  test_macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Test
        run: go test ./...

  publish_pages:
    needs: [build, test_linux, test_windows, test_macos]
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.ref == 'refs/heads/main'
    runs-on: uipath-ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: packages
          path: build/packages/
      - name: Generate commands 
        run: |
          tar -xzvf build/packages/uipathcli-linux-amd64.tar.gz
          ./uipath commands show > documentation/commands.json
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: 'documentation'
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5

  release:
    needs: [build, test_linux, test_windows, test_macos]
    if: github.ref == 'refs/heads/main'
    runs-on: uipath-ubuntu-latest
    permissions:
      contents: write
    env:
      UIPATHCLI_VERSION: ${{ needs.build.outputs.UIPATHCLI_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: packages
          path: build/packages/
      - name: Publish
        run: ./publish.sh "$UIPATHCLI_VERSION"
        env:
          GITHUB_TOKEN: ${{ github.token }}
